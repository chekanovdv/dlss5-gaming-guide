name: Apply DLSS5 Guide v16

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-v16.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply verified v16 patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, zlib, pathlib, subprocess
          expected = "324d0dfb930be872c503c986ce5c9c26970840b7"
          current = subprocess.check_output(["git","hash-object","index.html"], text=True).strip()
          if current != expected:
              raise SystemExit(f"Unexpected production index blob: {current} != {expected}")
          payload = """"""
          patch = zlib.decompress(base64.b64decode(payload))
          pathlib.Path("/tmp/v16.patch").write_bytes(patch)
          subprocess.check_call(["git","apply","--check","/tmp/v16.patch"])
          subprocess.check_call(["git","apply","/tmp/v16.patch"])
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          checks = ["<!DOCTYPE html", "Игр:</strong> 29", "Обновлено:</strong> 23.09.2026", "DLSS5 Autopilot v2.0.4", "1.17.0-beta.1", "Интерфейс v16", "Kingdom Come: Deliverance", "Kingdom Come: Deliverance II", "game-finder", "copy-btn"]
          for marker in checks:
              if marker not in html:
                  raise SystemExit(f"Missing marker: {marker}")
          if html.count('class="tab-panel"') < 29:
              raise SystemExit("Profile count check failed")
          PY
      - name: Commit production index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update DLSS5 guide v16: Autopilot 2.0.4, Feeder 1.17 beta, 232 reports"
          git push
