name: Deploy DLSS5 Guide

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-gaming-ramsu
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate index.html
        run: |
          test -s index.html
          grep -qi '<!DOCTYPE html' index.html
          grep -qi '<title>' index.html

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy over SFTP
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          printf '%s\n' \
            'put index.html /home/mainuser/web/gaming.ramsu.ru/public_html/index.html.new' \
            'rm /home/mainuser/web/gaming.ramsu.ru/public_html/index.html' \
            'rename /home/mainuser/web/gaming.ramsu.ru/public_html/index.html.new /home/mainuser/web/gaming.ramsu.ru/public_html/index.html' \
            'bye' \
          | sftp -b - -P "$SSH_PORT" -i ~/.ssh/id_ed25519 -oBatchMode=yes "$SSH_USER@$SSH_HOST"
