name: Apply DLSS5 Guide v13

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v13.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply v13 update
        run: python tools/update_dlss5_v13.py
      - name: Validate production file
        run: |
          test -s index.html
          grep -q 'DLSS5 Autopilot v1.9.0' index.html
          grep -q '1.16.0-beta.3' index.html
          grep -q 'Интерфейс v13' index.html
      - name: Commit production update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Update DLSS5 guide: Autopilot 1.9.0 and Feeder beta.3'
            git push origin HEAD:main
          fi
