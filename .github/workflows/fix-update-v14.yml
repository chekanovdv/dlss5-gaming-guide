name: Fix DLSS5 v14 updater

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-update-v14.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix validation and retrigger updater
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/update-v14.yml')
          s = p.read_text(encoding='utf-8')
          old = "s.count('section class=\"tab-panel\" id=')"
          new = "s.count('<section class=\"tab-panel\" id=')"
          if old not in s:
              raise SystemExit('validation marker not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/update-v14.yml
          git commit -m "Fix v14 updater profile validation"
          git push origin main
