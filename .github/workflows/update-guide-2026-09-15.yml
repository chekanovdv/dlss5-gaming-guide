name: Update DLSS5 Guide 2026-09-15

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-guide-2026-09-15.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch production guide
        run: python3 tools/update_20260915.py

      - name: Validate
        run: |
          test -s index.html
          grep -q 'Интерфейс v11' index.html
          grep -q 'DLSS5 Autopilot v1.8.2' index.html
          grep -q 'standalone-dlssnr' index.html
          grep -q '1.16.0-beta.2' index.html
          grep -q 'NVIDIA DLSS SDK 310.9.1' index.html
          grep -q 'Проверено: 15.09.2026' index.html
          test "$(grep -c "{ value: '" index.html)" -eq 27

      - name: Commit production update
        run: |
          git config user.name 'DLSS5 Guide Automation'
          git config user.email 'deploy@gaming.ramsu.ru'
          git add index.html
          git commit -m 'Update DLSS5 guide for 2026-09-15'
          git push origin main

      - name: Upload updated HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: dlss5-guide-2026-09-15
          path: index.html
          if-no-files-found: error
