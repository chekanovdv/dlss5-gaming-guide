name: Run corrected DLSS5 v14 updater

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-update-v14.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract and run corrected transform
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          y = Path('.github/workflows/update-v14.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = y.index(marker) + len(marker)
          end = y.index("\n          PY", start)
          body = y[start:end]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          body = body.replace("s.count('section class=\"tab-panel\" id=')", "s.count('<section class=\"tab-panel\" id=')")
          Path('/tmp/transform.py').write_text(body + '\n', encoding='utf-8')
          PY
          python /tmp/transform.py
          python - <<'PY'
          from pathlib import Path
          import hashlib, re
          s = Path('index.html').read_text(encoding='utf-8')
          ids = re.findall(r'<section class="tab-panel" id="([^"]+)"', s)
          assert len(ids) == 29 and len(set(ids)) == 29, (len(ids), len(set(ids)))
          for x in ('Интерфейс v14','DLSS5 Autopilot v2.0.1','1.16.0-beta.4','135 отчётов','Patch 2.03.00','Game update v1.0.12'):
              assert x in s, x
          print('profiles=', len(ids))
          print('sha256=', hashlib.sha256(Path('index.html').read_bytes()).hexdigest())
          PY
      - name: Commit v14 index
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update DLSS5 guide: Autopilot 2.0.1 and Sep 18 compatibility"
          git push origin main
