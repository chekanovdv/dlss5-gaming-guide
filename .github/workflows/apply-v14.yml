name: Apply DLSS5 Guide v14

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-v14.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v14 update
        run: python .github/scripts/update_v14.py

      - name: Validate
        run: |
          test -s index.html
          grep -q 'Интерфейс v14:' index.html
          grep -q 'DLSS5 Autopilot v2.0.1' index.html
          grep -q 'Patch 2.03.00' index.html
          grep -q 'Patch 2.0.6' index.html
          test "$(grep -o 'value:' index.html | wc -l)" -ge 29

      - name: Commit production index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update DLSS5 guide v14: Autopilot 2.0.1 and game patches"
          git push
