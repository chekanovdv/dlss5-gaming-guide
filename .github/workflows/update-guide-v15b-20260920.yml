name: Update DLSS5 Guide v15b

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-guide-v15b-20260920.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch production guide
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          assert 'Интерфейс v14:' in s, 'Expected production v14 baseline'
          assert 'DLSS5 Autopilot v2.0.1' in s, 'Expected Autopilot 2.0.1 baseline'
          m = re.search(r"const allGames = \[(.*?)\n\];", s, re.S)
          assert m, 'allGames not found'
          assert len(re.findall(r"\{\s*value:\s*['\"]", m.group(1))) == 29, 'Expected 29 production profiles'
          assert 'Kingdom Come: Deliverance' in m.group(1) and 'Kingdom Come: Deliverance II' in m.group(1)

          s = s.replace('<span class="badge"><strong>Обновлено:</strong> 19.09.2026</span>', '<span class="badge"><strong>Обновлено:</strong> 20.09.2026</span>')
          s = s.replace('Проверено: 19.09.2026', 'Проверено: 20.09.2026')
          s = s.replace('Источники: 19.09.2026', 'Источники: 20.09.2026')

          autopilot = '''<details class="autopilot-details" id="autopilot-note"><summary>DLSS5 Autopilot — когда он нужен?</summary><div class="autopilot-details-body">
          <p><strong>Актуально: DLSS5 Autopilot v2.0.3 (20.09.2026).</strong> Это установщик, диагностический маршрутизатор и инструмент измерения стоимости Neural Rendering; для уже настроенных игр сохраняйте game-specific профиль из этого справочника.</p>
          <ul>
          <li><strong>NVIDIA driver:</strong> актуальный Game Ready по состоянию на 20.09.2026 — <strong>616.92 WHQL</strong>; минимум для текущего DLSS5 toolchain — <code>616.56</code>.</li>
          <li><strong>Первый маршрут:</strong> правила выбора не изменились. Для игр <strong>без собственного DLSS</strong> на <code>616.64+</code> и 64-bit D3D11/D3D12 первым выбором остаётся <strong>standalone-dlssnr</strong>, если он доступен; <code>feeder</code> — fallback. Для игр со штатным DLSS D3D12 обычно первым остаётся <code>optiscaler</code>; <code>native</code> и <code>neural-upstream</code> доступны как альтернативы, D3D11 со штатным DLSS — <code>bridge</code>.</li>
          <li><strong>Что изменилось в 2.0.2:</strong> диагностика корректно распознаёт работу NR в wilsjo2 OptiScaler fork по строкам <code>elapsed:</code> и <code>finished picture</code>, не принимает кратковременный frame skip за отказ модели, исправляет частичную установку через symlink/junction и ряд ложных crash/loaded-module verdicts. Это повышает надёжность <em>did it work?</em>, но не является новым подтверждением совместимости конкретной игры.</li>
          <li><strong>Что изменилось в 2.0.3:</strong> игры, запущенные через Play/AUTOPILOT, больше не наследуют DLL search path временной папки самого Autopilot; исправлена классификация Vulkan/OpenGL-only эмуляторов и ложное сообщение о незагруженном <code>dlss5-bridge.addon64</code>, если ReShade зарегистрировал add-on чуть позже process snapshot. Для 29 Windows-профилей справочника это прежде всего исправление запуска и диагностики, а не смена route.</li>
          <li><strong>DXVK / native-DLSS detection:</strong> исключения из 2.0.1 сохраняются: DXVK-игры не переводятся на standalone только из-за драйвера 616.64+, а остаточные NGX-файлы и файлы самого Autopilot не считаются доказательством штатного DLSS.</li>
          <li><strong>Cadence / NR Scale:</strong> для <code>neural-upstream</code> при DLSS Frame Generation оставляйте cadence <strong>Quality</strong>. Для <code>optiscaler</code> Model Resolution остаётся главным регулятором; для Feeder 64-bit D3D11 — work area. Одиночное измерение не переносите в таблицу как универсальный оптимум; используйте его как A/B-точку.</li>
          <li><strong>DLSS runtimes:</strong> официальный NVIDIA DLSS SDK — <strong>310.9.1</strong> (SR/RR, включая Ray Reconstruction Transformer Mode / Preset F). DLSS Neural Rendering runtime <code>nvngx_dlssnr.dll</code> для RTX 50 остаётся отдельным runtime поколения <strong>310.8.0</strong> и не является содержимым публичного DLSS SDK.</li>
          <li><strong>DLSS5-Feeder:</strong> стабильная рекомендация остаётся <strong>0.15.1</strong>. Для troubleshooting доступен <strong>1.16.0-beta.6 (20.09.2026)</strong>. В 32-bit цепочке IPC поднят до v10 — необходимо обновлять одновременно <code>dlss5-feed.addon32</code> и <code>host64\\dlss5-feed-host64.exe</code>; beta.5/beta.6 halves несовместимы. Также исправлены mouse/button fallback панели, modifier hotkeys и расширена диагностика NGX init с указанием faulting module/call chain. Для 64-bit профилей без соответствующей проблемы это не причина заменять stable.</li>
          <li><strong>OptiPatcher Rolling:</strong> актуальный build от <strong>19.09.2026</strong>, commit <code>c679ee7</code>. В нём присутствуют обновлённые patches для <strong>S.T.A.L.K.E.R. 2</strong> и <strong>Beast of Reincarnation</strong>, а также поддержка <strong>Resonance: A Plague Tale Legacy</strong>. Для этих трёх профилей используйте текущий rolling вместо зафиксированной ранее сборки 11.09.</li>
          <li><strong>Shared compatibility feed:</strong> база содержит <strong>189 отчётов</strong> (сгенерирована 20.09.2026 19:48 UTC). 007 First Light — <code>optiscaler</code> <strong>1 success / 0 fail</strong>; Cyberpunk 2077 — <code>optiscaler</code> <strong>2 / 2</strong> и <code>neural-upstream</code> <strong>2 / 0</strong>; Crimson Desert — <code>optiscaler</code> <strong>1 / 1</strong>, один успешный замер 75% ≈ 5.45 ms; Onimusha — <code>native</code> <strong>0 / 1</strong> и <code>optiscaler</code> <strong>0 / 1</strong>. Для Starfield и RDR2 появились противоположные результаты между разными executable-записями, поэтому они не используются как основание для автоматической смены рекомендованного профиля. Малые выборки остаются ориентиром для A/B, а не универсальным verdict.</li>
          </ul>
          <p><a href="https://github.com/Kizzuwatnaa/DLSS5-Autopilot/releases/tag/v2.0.3" target="_blank">DLSS5 Autopilot v2.0.3 — changelog</a></p>
          <p><a href="https://github.com/jlrouzies-fr/DLSS5-Feeder/releases/tag/v1.16.0-beta.6" target="_blank">DLSS5-Feeder 1.16.0-beta.6 — troubleshooting build</a></p>
          <p><a href="https://github.com/optiscaler/OptiPatcher/releases/tag/rolling" target="_blank">OptiPatcher Rolling — 19.09.2026</a></p>
          <p><a href="https://github.com/NVIDIA/DLSS/releases/tag/v310.9.1" target="_blank">NVIDIA DLSS SDK 310.9.1</a></p>
          <p><a href="https://www.nvidia.com/en-sg/geforce/news/wardogs-aniimo-007-first-light-path-tracing-geforce-game-ready-driver/" target="_blank">NVIDIA Game Ready 616.92 WHQL — 09.09.2026</a></p>
          </div></details>'''
          s, n = re.subn(r'<details class="autopilot-details" id="autopilot-note">.*?</details>', lambda _m: autopilot, s, count=1, flags=re.S)
          assert n == 1, 'Autopilot block replacement failed'

          s = s.replace('DLSS5 Autopilot v2.0.1', 'DLSS5 Autopilot v2.0.3')
          s = s.replace('/releases/tag/v2.0.1', '/releases/tag/v2.0.3')
          s = s.replace('feed (18.09, 136 отчётов)', 'feed (20.09, 189 отчётов)')

          old_cp = '<strong>Autopilot shared results — 18.09 / 136 reports</strong>Для Cyberpunk 2077 актуальный feed показывает <code>optiscaler</code> <strong>2 success / 2 fail</strong> и <code>neural-upstream</code> <strong>1 success / 0 fail</strong>. Выборка всё ещё мала: основной ручной профиль OptiScaler_DLSSNR не меняется, а upstream остаётся A/B-альтернативой. На драйвере 616.92 в feed уже два успешных результата; проверяйте конкретную систему по логам и держите FG OFF во время настройки NR.'
          new_cp = '<strong>Autopilot shared results — 20.09 / 189 reports</strong>Для Cyberpunk 2077 актуальный feed показывает <code>optiscaler</code> <strong>2 success / 2 fail</strong> и <code>neural-upstream</code> <strong>2 success / 0 fail</strong>. Выборка всё ещё мала: основной ручной профиль OptiScaler_DLSSNR не меняется, а upstream остаётся A/B-альтернативой. На драйвере 616.92 в feed уже три успешных сессии суммарно по маршрутам; проверяйте конкретную систему по логам и держите FG OFF во время настройки NR.'
          assert old_cp in s, 'Cyberpunk compatibility callout not found'
          s = s.replace(old_cp, new_cp)

          rdr_pat = r'<div class="callout warn"><strong>Новый отчёт Autopilot</strong>.*?</div>'
          rdr_new = '<div class="callout warn"><strong>Autopilot shared results — 20.09 / 189 reports</strong>Feed теперь разделяет два executable: для основного <code>RDR2.exe</code> есть <strong>1 success / 0 fail</strong> на <code>optiscaler</code> (driver 616.56), а для <code>PlayRDR2.exe</code> — <strong>0 / 1</strong>. Это подтверждает, что launcher/API имеют значение: тестируйте основной EXE в <strong>DirectX 12</strong>, а не Vulkan, и не считайте отказ launcher-записи доказательством несовместимости всего профиля. Текущий ручной маршрут ASI → Ultimate ASI Loader → OptiPatcher остаётся основным.</div>'
          s, n = re.subn(rdr_pat, lambda _m: rdr_new, s, count=1, flags=re.S)
          assert n == 1, 'RDR2 callout replacement failed'

          s = s.replace('rolling build от <strong>11.09.2026</strong>', 'rolling build от <strong>19.09.2026</strong>')
          s = s.replace('Патч вышел после OptiPatcher rolling 11.09: также проверьте, что patcher действительно находит актуальные patterns; при отсутствии сигнатуры не форсируйте старые offsets.', 'Текущий OptiPatcher rolling от 19.09 вышел уже после game update 1.0.12 и содержит обновление Beast support. Используйте его, но всё равно проверяйте, что patcher действительно находит актуальные patterns; при отсутствии сигнатуры не форсируйте старые offsets.')
          s = s.replace('<strong>OptiPatcher rolling 11.09.2026+</strong>', '<strong>OptiPatcher rolling 19.09.2026</strong>')
          s = s.replace('используйте rolling build от 11 сентября или новее.', 'используйте актуальный rolling build от 19 сентября.')
          s = s.replace('Последний OptiPatcher rolling в момент проверки датирован 11.09, то есть старше game build 2.0.6. После обновления <strong>обязательно проверьте лог patcher/signature match</strong>; при отсутствии сигнатуры не форсируйте старый patch. Рекомендуемый DLSS route не меняется.', 'Актуальный OptiPatcher rolling датирован 19.09 и уже содержит обновлённые S.T.A.L.K.E.R. 2 patches после game build 2.0.6. Используйте его и всё равно <strong>проверьте лог patcher/signature match</strong>; при отсутствии сигнатуры не форсируйте старый patch. Рекомендуемый DLSS route не меняется.')
          s = s.replace('rolling 11.09 старше текущего build', 'rolling 19.09 содержит обновлённые STALKER 2 patches; перепроверить signature match')
          s = s.replace('Rolling Release от 11.09.2026 или новее', 'Rolling Release от 19.09.2026')
          s = s.replace('rolling 11.09.2026+ или будущий stable', 'rolling 19.09.2026 или будущий stable')
          s = s.replace('Rolling Release 11.09.2026+', 'Rolling Release 19.09.2026')

          footer = '''<footer class="footer"><strong>Интерфейс v15:</strong> 29 игровых профилей, комплексная проверка 20.09.2026. DLSS5 Autopilot обновлён до <strong>2.0.3</strong>: route-policy не менялась; v2.0.2 исправила распознавание реально работающего NR, symlink/junction install и ложные crash verdicts, а v2.0.3 — наследование временного DLL search path, API-классификацию эмуляторов и позднюю регистрацию Bridge add-on. Shared compatibility feed — <strong>189 отчётов</strong> (20.09 19:48 UTC): Cyberpunk 2077 — 2/2 optiscaler и <strong>2/0 neural-upstream</strong>; RDR2 теперь имеет противоположные результаты для RDR2.exe и PlayRDR2.exe; Crimson Desert — 1/1 optiscaler с одиночным успешным замером 75% ≈ 5.45 ms. DLSS5-Feeder: stable <strong>0.15.1</strong>, troubleshooting <strong>1.16.0-beta.6</strong>; в 32-bit цепочке IPC v10 требует одновременного обновления add-on и host64. OptiPatcher Rolling обновлён <strong>19.09.2026</strong> (c679ee7): актуализированы S.T.A.L.K.E.R. 2 и Beast of Reincarnation, сохранена поддержка Resonance. Новых game patches после уже учтённых 007 1.2.1, Crimson Desert 2.03.00, S.T.A.L.K.E.R. 2 2.0.6 и Beast 1.0.12, требующих смены маршрута, не выявлено. Без новых stable-релизов: OptiScaler_DLSSNR 0.2.0, OptiScaler 0.9.4, RE_DLSS5_Load_Mod 0.63, REFramework 1.5.9.1, ReShade 6.8.0, NVIDIA DLSS SDK 310.9.1; Game Ready остаётся 616.92 WHQL.</footer>'''
          s, n = re.subn(r'<footer class="footer">.*?</footer>', lambda _m: footer, s, count=1, flags=re.S)
          assert n == 1, 'Footer replacement failed'

          assert 'Интерфейс v15:' in s
          assert 'DLSS5 Autopilot v2.0.3' in s
          assert '189 отчётов' in s
          assert '1.16.0-beta.6' in s
          assert 'OptiPatcher rolling 19.09.2026' in s
          for token in ['gameSearch', 'gameResults', 'contextBar', 'copy-btn', 'step-section', '@media (max-width:580px)', 'Kingdom Come: Deliverance II']:
              assert token in s, token
          m = re.search(r"const allGames = \[(.*?)\n\];", s, re.S)
          assert len(re.findall(r"\{\s*value:\s*['\"]", m.group(1))) == 29
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate index.html
        run: |
          test -s index.html
          grep -qi '<!DOCTYPE html' index.html
          grep -q 'Интерфейс v15:' index.html
          grep -q 'DLSS5 Autopilot v2.0.3' index.html
          grep -q 'Kingdom Come: Deliverance II' index.html

      - name: Commit v15 to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update DLSS5 guide: Autopilot 2.0.3, Feeder beta6, OptiPatcher rolling'
          git push origin HEAD:main

      - name: Upload production HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: dlss5-guide-v15-2026-09-20
          path: index.html
          if-no-files-found: error

      - name: Explicitly dispatch production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" -f ref=main
