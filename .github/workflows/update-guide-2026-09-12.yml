name: Update DLSS5 Guide 2026-09-12

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-guide-2026-09-12.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch production guide
        run: python3 tools/update_20260912.py

      - name: Validate
        run: |
          test -s index.html
          grep -q 'DLSS5 Autopilot v1.8.1' index.html
          grep -q 'Проверено: 12.09.2026' index.html
          grep -q 'Если v0.63 не запускается' index.html
          grep -q 'Драйвер 616.64+ / Autopilot 1.8.1' index.html
          grep -q 'RTX 5080 + Frame Generation' index.html

      - name: Commit production update
        run: |
          git config user.name 'DLSS5 Guide Automation'
          git config user.email 'deploy@gaming.ramsu.ru'
          git add index.html
          git commit -m 'Update DLSS5 guide for 2026-09-12'
          git push origin main

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy over SFTP
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          printf '%s\n' \
            'put index.html /home/mainuser/web/gaming.ramsu.ru/public_html/index.html.new' \
            'rm /home/mainuser/web/gaming.ramsu.ru/public_html/index.html' \
            'rename /home/mainuser/web/gaming.ramsu.ru/public_html/index.html.new /home/mainuser/web/gaming.ramsu.ru/public_html/index.html' \
            'bye' \
          | sftp -b - -P "$SSH_PORT" -i ~/.ssh/id_ed25519 -oBatchMode=yes "$SSH_USER@$SSH_HOST"

      - name: Upload updated HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: dlss5-guide-2026-09-12
          path: index.html
          if-no-files-found: error
