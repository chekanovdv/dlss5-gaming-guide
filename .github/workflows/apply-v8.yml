name: Apply DLSS5 v8

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-v8.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install updater dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Apply researched v8 changes
        run: python tools/update_dlss5_v8.py

      - name: Validate production HTML
        run: |
          test -s index.html
          grep -qi '<!DOCTYPE html' index.html
          grep -q 'DLSS5 Autopilot v1.8.0' index.html
          grep -q 'DLSS5-Feeder v0.15.1' index.html
          grep -q 'RE_DLSS5_Load_Mod v0.63' index.html
          grep -q 'Интерфейс v8' index.html
          test "$(grep -o "section class=\"tab-panel" index.html | wc -l)" -eq 27

      - name: Commit production update
        run: |
          git config user.name 'DLSS5 Guide Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Update DLSS5 guide to v8'
          git push origin main

      - name: Trigger production deploy explicitly
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
