name: Apply DLSS5 Guide v7

on:
  push:
    branches:
      - main
    paths:
      - tools/apply_v7.py
      - tools/run_v7.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install parser
        run: python -m pip install beautifulsoup4

      - name: Update index.html
        run: python tools/apply_v7.py

      - name: Validate
        run: |
          test -s index.html
          grep -q '007: First Light' index.html
          grep -q 'Yakuza Kiwami 3' index.html
          grep -q 'Игр:</strong> 27' index.html

      - name: Commit production update
        run: |
          git config user.name "DLSS5 Guide Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add 13 DLSS5 game profiles" || exit 0
          git push origin main
