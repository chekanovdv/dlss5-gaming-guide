name: Apply DLSS5 Guide v17 DXL

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-v17-dxl.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate base
        run: |
          test "$(git hash-object index.html)" = "6e7547b377da6bc72f9f57512da29d9826dd3a7e"
          grep -Fq 'Интерфейс v16' index.html
          grep -Fq 'Игр:</strong> 29' index.html

      - name: Apply v17 DXL update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          pairs = [
              (
                  '<p>Рабочая для RTX 5080 схема: <strong>REFramework → ReShade Full Add-on Support → RE_DLSS5_Load_Mod → DLSS5 Neural Rendering</strong>. Для этой игры рекомендуется использовать именно RE Engine-совместимый путь с нативными motion vectors.</p>',
                  '<p>Проверенная базовая для RTX 5080 схема: <strong>REFramework → ReShade Full Add-on Support → RE_DLSS5_Load_Mod → DLSS5 Neural Rendering</strong>. Для этой игры рекомендуется RE Engine-совместимый путь с нативными motion vectors. <strong>DXL 0.7</strong> того же автора теперь доступен как отдельный A/B-маршрут и не считается автоматической заменой уже стабильного профиля v0.63.</p>'
              ),
              (
                  '<tr><td>API / Loader</td><td>RE Engine + RE_DLSS5_Load_Mod</td></tr>',
                  '<tr><td>API / Loader</td><td>RE Engine + RE_DLSS5_Load_Mod v0.63 (baseline); DXL 0.7 — отдельный A/B</td></tr>'
              ),
              (
                  '<div class="callout warn"><strong>Если v0.63 не запускается</strong>v0.63 остаётся текущим официальным релизом. При этом в пользовательских отчётах по Onimusha есть системы, где v0.62/v0.63 не загружаются, а <strong>v0.59 работает стабильно</strong>. Сначала исключите конфликт proxy-DLL и полностью удалите D18; если проблема сохраняется — используйте v0.59 как проверенный fallback для этой конкретной системы, не смешивая версии.</div>',
                  '<div class="callout warn"><strong>Если v0.63 не запускается</strong>v0.63 остаётся текущим официальным релизом. При этом в пользовательских отчётах по Onimusha есть системы, где v0.62/v0.63 не загружаются, а <strong>v0.59 работает стабильно</strong>. Сначала исключите конфликт proxy-DLL и полностью удалите D18; если проблема сохраняется — используйте v0.59 как проверенный fallback для этой конкретной системы, не смешивая версии.</div>\n<div class="callout ok"><strong>DXL 0.7 — новый альтернативный loader от автора RE_DLSS5_Load_Mod</strong>Релиз от 17.09.2026 развивает предыдущий loader и имеет отдельную логику для RE Engine/Onimusha. Начинайте с обычного режима DXL с native motion-vector capture и <strong>Force compatibility OFF</strong>. Новый Force compatibility обрабатывает уже финальный кадр игры без попытки получить pre-DLSS frame/native motion vectors; используйте его только как fallback, если обычный NR-путь не даёт эффекта. В этом режиме в обработку может попадать UI, поэтому результат нельзя считать эквивалентом нативного MV-маршрута. Не устанавливайте DXL поверх активной копии RE_DLSS5_Load_Mod: сначала сделайте backup/clean install и тестируйте маршруты раздельно.</div>'
              ),
              (
                  '<p>Первый запуск выполняйте с <strong>Frame Generation OFF</strong>, чтобы отдельно проверить Neural Rendering. В актуальной ветке RE_DLSS5_Load_Mod предыдущие ограничения совместимости с FG были переработаны, но game-specific сочетание всё равно нужно тестировать после каждого обновления игры/loader.</p>',
                  '<p>Первый запуск выполняйте с <strong>Frame Generation OFF</strong>, чтобы отдельно проверить Neural Rendering. В актуальной ветке RE_DLSS5_Load_Mod предыдущие ограничения совместимости с FG были переработаны; DXL также заявляет работу с FG в поддерживаемых играх. Но для Onimusha каждую связку проверяйте отдельно: сначала NR, затем только один FG-механизм. Успешный запуск DXL Force compatibility не подтверждает native-MV + FG.</p>'
              ),
              (
                  '<li><a href="https://github.com/LCPD15/RE_DLSS5_Load_Mod/releases/tag/v0.63" target="_blank">RE_DLSS5_Load_Mod v0.63 — GitHub</a></li></ul>',
                  '<li><a href="https://github.com/LCPD15/RE_DLSS5_Load_Mod/releases/tag/v0.63" target="_blank">RE_DLSS5_Load_Mod v0.63 — GitHub</a></li><li><a href="https://github.com/LCPD15/DXL/releases/tag/v0.7" target="_blank" rel="noopener noreferrer">DXL 0.7 — альтернативный loader от того же автора</a></li><li><a href="https://github.com/LCPD15/DXL" target="_blank" rel="noopener noreferrer">DXL — документация и Force compatibility</a></li></ul>'
              ),
              (
                  '<footer class="footer"><strong>Интерфейс v16:</strong> 29 игровых профилей, комплексная проверка 23.09.2026. DLSS5 Autopilot обновлён до <strong>2.0.4</strong>: route-policy не менялась, но исправлен выбор правильного wilsjo2 OptiScaler archive и разделение stable/beta DLSS5-Feeder. Shared compatibility feed — <strong>232 отчёта</strong> (22.09 19:32 UTC): Cyberpunk optiscaler 3/2 и upstream 2/0; Starfield optiscaler 1/1 и upstream 1/0; RDR2.exe optiscaler 1/1; AC Black Flag Resynced optiscaler 2/0. DLSS5-Feeder: stable <strong>0.15.1</strong>, troubleshooting <strong>1.17.0-beta.1</strong> с поддержкой Dagherbou и wilsjo2 NR-consumer; поддержка fork не считается game-specific подтверждением. OptiPatcher Rolling обновлён <strong>22.09.2026</strong> (<code>75b76bc</code>). NVIDIA Game Ready — <strong>617.14 WHQL</strong>; для старых community-результатов 616.92 остаётся полезным A/B baseline. Новых stable-релизов OptiScaler_DLSSNR, OptiScaler, RE_DLSS5_Load_Mod, REFramework, ReShade и NVIDIA DLSS SDK, требующих глобальной смены маршрутов, не обнаружено. Сначала проверяйте NR без FG; неподтверждённые fork/FG-комбинации не переносите между играми.</footer>',
                  '<footer class="footer"><strong>Интерфейс v17:</strong> 29 игровых профилей, комплексная проверка 23.09.2026. DLSS5 Autopilot — <strong>2.0.4</strong>: route-policy не менялась, исправлены выбор правильного wilsjo2 OptiScaler archive и разделение stable/beta DLSS5-Feeder. Shared compatibility feed — <strong>232 отчёта</strong> (22.09 19:32 UTC): Cyberpunk optiscaler 3/2 и upstream 2/0; Starfield optiscaler 1/1 и upstream 1/0; RDR2.exe optiscaler 1/1; AC Black Flag Resynced optiscaler 2/0. DLSS5-Feeder: stable <strong>0.15.1</strong>, troubleshooting <strong>1.17.0-beta.1</strong> с поддержкой Dagherbou и wilsjo2 NR-consumer; поддержка fork не считается game-specific подтверждением. OptiPatcher Rolling обновлён <strong>22.09.2026</strong> (<code>75b76bc</code>). NVIDIA Game Ready — <strong>617.14 WHQL</strong>; для старых community-результатов 616.92 остаётся полезным A/B baseline. Для Onimusha добавлен <strong>DXL 0.7</strong> (17.09.2026) как отдельный A/B-маршрут от автора RE_DLSS5_Load_Mod: обычный native-MV режим проверяется первым, Force compatibility — только fallback и не приравнивается к native-MV/FG. Новых stable-релизов OptiScaler_DLSSNR, OptiScaler, RE_DLSS5_Load_Mod, REFramework, ReShade и NVIDIA DLSS SDK, требующих глобальной смены остальных маршрутов, не обнаружено. Сначала проверяйте NR без FG; неподтверждённые fork/FG-комбинации не переносите между играми.</footer>'
              ),
          ]

          for i, (old, new) in enumerate(pairs, 1):
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'replacement {i}: expected 1 match, got {count}')
              s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate v17
        run: |
          test "$(git hash-object index.html)" = "0fe24e08359d61f4683f36f562f639e031e77fa1"
          grep -Fq 'Интерфейс v17' index.html
          grep -Fq 'DXL 0.7' index.html
          grep -Fq 'Kingdom Come: Deliverance II' index.html
          grep -Fq 'Игр:</strong> 29' index.html

      - name: Commit production index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update DLSS5 guide v17: add DXL 0.7 route for Onimusha'
          git push origin HEAD:main
