name: Apply DLSS5 Guide v17 DXL

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-v17-dxl.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate base
        run: |
          test "$(git hash-object index.html)" = "6e7547b377da6bc72f9f57512da29d9826dd3a7e"
          grep -Fq 'Интерфейс v16' index.html
          grep -Fq 'Игр:</strong> 29' index.html
      - name: Apply v17 patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, zlib, pathlib
          payload = ''
          pathlib.Path('/tmp/v17.patch').write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY
          git apply /tmp/v17.patch
      - name: Validate v17
        run: |
          test "$(git hash-object index.html)" = "0fe24e08359d61f4683f36f562f639e031e77fa1"
          grep -Fq 'Интерфейс v17' index.html
          grep -Fq 'DXL 0.7' index.html
          grep -Fq 'Kingdom Come: Deliverance II' index.html
          grep -Fq 'Игр:</strong> 29' index.html
      - name: Commit production index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update DLSS5 guide v17: add DXL 0.7 route for Onimusha'
          git push origin HEAD:main
