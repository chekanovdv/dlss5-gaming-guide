name: Promote HTML Payload

on:
  push:
    branches:
      - main
    paths:
      - payload.b64

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode payload
        run: |
          base64 -d payload.b64 | gzip -d > index.html
          test -s index.html
          grep -qi '<!DOCTYPE html' index.html
          grep -qi '<title>' index.html

      - name: Commit production index
        run: |
          git config user.name "DLSS5 Guide Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm payload.b64
          git commit -m "Update DLSS5 guide to v7"
          git push origin main
